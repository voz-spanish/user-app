<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語彙(フラッシュカード) | VOZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="user-flashcard.css">
</head>
<body>

  <header class="header">
    <span class="header-logo">VOZ</span>
    <div class="header-actions">
      <button class="icon-btn" id="btn-notif" aria-label="アナウンス">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notif-dot" id="notif-dot"></span>
      </button>
      <button class="burger-btn" id="burger-btn" aria-label="メニュー">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="drawer-overlay" id="drawer-overlay"></div>
  <nav class="drawer" id="drawer">
    <ul class="drawer-nav">
      <li><a href="../user-home/user-home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        ホーム
      </a></li>
      <li class="drawer-divider"></li>
      <li><a href="../user-lesson/user-lesson.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>
        レッスン
      </a></li>
      <li><a href="../user-question/user-question.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        今日の質問
      </a></li>
      <li><a href="../user-flashcard/user-flashcard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        語彙(フラッシュカード)
      </a></li>
      <li><a href="../user-dictionary/user-dictionary.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        辞書・活用表
      </a></li>
      <li><a href="../user-announce/user-announce.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        アナウンス
      </a></li>
    </ul>
    <button class="logout-btn" id="logout-btn">ログアウト</button>
  </nav>

  <main class="main">

    <!-- ① カテゴリ・セット一覧 -->
    <section class="view-list" id="view-list">
      <p class="list-intro">好きなカテゴリを選んでトレーニングしよう。1セット終えるごとに、その分野の語彙が身についていきます。</p>

      <div class="category-group" id="lp-list-group" style="display:none">
        <p class="category-title">レッスン</p>
        <div id="lp-list"></div>
      </div>

      <div id="category-groups"></div>
      <p class="empty-msg" id="empty-msg">フラッシュカードがまだありません</p>
    </section>

    <!-- ② トレーニング画面 -->
    <section class="view-training" id="view-training">
      <div class="training-top">
        <button class="training-exit" id="btn-exit-training">✕</button>
        <span class="training-progress" id="training-progress"></span>
      </div>
      <p class="training-set-name" id="training-set-name"></p>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

      <div class="flip-card" id="flip-card">
        <div class="flip-card-inner" id="flip-card-inner">
          <div class="flip-front" id="flip-front"></div>
          <div class="flip-back" id="flip-back"></div>
        </div>
      </div>
      <p class="training-hint-tap" id="training-hint-tap">タップして意味を見る</p>

      <div class="training-actions" id="training-actions">
        <button class="btn-retry" id="btn-retry">もう一度</button>
        <button class="btn-known" id="btn-known">覚えた</button>
      </div>
    </section>

    <!-- ③ 完了画面 -->
    <section class="view-complete" id="view-complete">
      <p class="complete-title">よくできました</p>
      <p class="complete-sub" id="complete-sub"></p>
      <div class="complete-actions">
        <button class="btn-complete btn-complete--outline" id="btn-complete-retry">もう一度</button>
        <button class="btn-complete btn-complete--accent" id="btn-complete-back">一覧に戻る</button>
      </div>
    </section>

    <!-- ④ レッスン フラッシュカード: モード選択 -->
    <section class="view-lp-mode" id="view-lp-mode" style="display:none">
      <div class="mode-wrap">
        <button class="back-btn" id="lp-mode-back" type="button">← 一覧に戻る</button>
        <h2 class="mode-title" id="lp-mode-title"></h2>
        <p class="mode-subtitle">モードを選んでください（毎回選び直せます）</p>
        <div class="mode-cards">
          <button class="mode-card" id="lp-mode-es-jp" type="button">
            <div class="mode-icon">ES → JP</div>
            <div class="mode-name">スペイン語 → 日本語</div>
            <div class="mode-desc">スペイン語センテンスが出題されます<br>単語をタップで意味を確認できます</div>
          </button>
          <button class="mode-card" id="lp-mode-jp-es" type="button">
            <div class="mode-icon">JP → ES</div>
            <div class="mode-name">日本語 → スペイン語</div>
            <div class="mode-desc">日本語訳が出題されます<br>チャンクをタップでスペイン語を確認できます</div>
          </button>
        </div>
      </div>
    </section>

    <!-- ⑤ レッスン フラッシュカード: トレーニング（練習専用・進捗には反映されません） -->
    <section class="view-lp-training" id="view-lp-training" style="display:none">

      <div id="lp-card-mode-wrap">
        <div class="card-topbar">
          <button class="back-btn-small" id="lp-back-btn" type="button">✕ 一覧に戻る</button>
          <div class="card-progress-wrap">
            <div class="card-progress-bar"><div class="card-progress-fill" id="lp-progress-fill"></div></div>
            <span class="card-progress-text" id="lp-progress-text"></span>
          </div>
          <div class="card-mode-badge" id="lp-mode-badge"></div>
          <button class="icon-btn-small" id="lp-search-btn" type="button" aria-label="辞書検索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
        </div>

        <div class="card-area" id="lp-card-area">
          <div class="flashcard" id="lp-flashcard">

            <div class="card-face" id="lp-front">
              <div class="card-label" id="lp-front-label"></div>
              <div class="card-audio-row" id="lp-front-audio-row" style="display:none">
                <button class="btn-play-audio" id="lp-btn-play-front" type="button">▶ 再生</button>
              </div>
              <div class="card-content" id="lp-front-content"></div>
              <div id="lp-front-chunk-reveal-wrap" style="display:none">
                <button class="btn-chunk-reveal" id="lp-btn-chunk-reveal" type="button">＋ チャンク直訳</button>
                <div class="chunk-reveal-panel" id="lp-chunk-reveal-panel" style="display:none">
                  <div class="chunk-reveal-tokens" id="lp-chunk-reveal-tokens"></div>
                  <div class="card-bubble chunk-reveal-bubble" id="lp-chunk-reveal-bubble" style="display:none"></div>
                </div>
              </div>
              <div class="card-bubble" id="lp-front-bubble" style="display:none"></div>
              <div class="card-input-section" id="lp-front-input-section" style="display:none">
                <textarea class="card-input" id="lp-card-input" placeholder="スペイン語で入力してみましょう…" rows="2"></textarea>
              </div>
              <button class="btn-flip" id="lp-btn-flip" type="button">めくる →</button>
            </div>

            <div class="card-face" id="lp-back" style="display:none">
              <div class="card-label" id="lp-back-label"></div>
              <div class="card-audio-row" id="lp-back-audio-row" style="display:none">
                <button class="btn-play-audio" id="lp-btn-play-back" type="button">▶ 再生</button>
              </div>
              <div class="card-content" id="lp-back-content"></div>
              <div class="card-bubble" id="lp-back-bubble" style="display:none"></div>

              <div class="user-answer-wrap" id="lp-user-answer-wrap" style="display:none">
                <div class="user-answer-label">あなたの答え <span class="user-answer-hint">（修正できます）</span></div>
                <textarea class="user-answer-textarea" id="lp-user-answer-text" rows="2"></textarea>
              </div>

              <div class="card-judge-row">
                <button class="btn-judge btn-maru" id="lp-btn-maru" type="button">○</button>
                <button class="btn-judge btn-sankaku" id="lp-btn-sankaku" type="button">△</button>
                <button class="btn-judge btn-batsu" id="lp-btn-batsu" type="button">×</button>
              </div>
            </div>

          </div>
        </div>
      </div>

      <div id="lp-result-view" style="display:none">
        <div class="result-wrap">
          <h2 class="result-title">このモード完了</h2>
          <div class="result-stats" id="lp-result-stats"></div>
          <div class="result-missed" id="lp-result-missed"></div>
          <div class="result-actions">
            <button class="btn-retry-all" id="lp-btn-retry-all" type="button">もう一度最初から</button>
            <button class="btn-back-list" id="lp-btn-back-list" type="button">← 一覧に戻る</button>
          </div>
        </div>
      </div>

    </section>

  </main>

  <!-- 辞書検索パネル（フラッシュカード中に画面下からスライドイン） -->
  <div class="search-panel-overlay" id="search-panel-overlay">
    <div class="search-panel" id="search-panel">
      <div class="search-panel-topbar">
        <span class="search-panel-title">辞書・活用表</span>
        <button class="search-panel-close" id="search-panel-close" type="button" aria-label="閉じる">✕</button>
      </div>

      <div class="search-panel-input-row">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search-panel-input" placeholder="スペイン語・日本語で検索" />
      </div>

      <div class="search-panel-body" id="search-panel-body">
        <ul class="entry-list" id="search-entry-list"></ul>
        <p class="empty-msg" id="search-empty-msg" style="display:none">該当する登録がありません</p>
      </div>

      <!-- 単語詳細（同じパネル内） -->
      <div class="search-detail-body" id="search-detail-body" style="display:none">
        <button class="back-btn-small" id="search-detail-back-btn" type="button">← 一覧に戻る</button>
        <div id="search-detail-content"></div>
      </div>
    </div>
  </div>

  <!-- YouTube hidden player（レッスン フラッシュカードの区間再生用） -->
  <div id="yt-hidden" style="position:fixed;bottom:-999px;left:0;width:1px;height:1px;overflow:hidden">
    <div id="yt-player-hidden"></div>
  </div>

  <nav class="footer-nav">
    <a class="nav-btn" id="footer-nav-home" href="../user-home/user-home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>ホーム</span>
    </a>
    <a class="nav-btn" id="footer-nav-lesson" href="../user-lesson/user-lesson.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>
      <span>レッスン</span>
    </a>
    <a class="nav-btn" id="footer-nav-question" href="../user-question/user-question.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span>質問</span>
    </a>
    <a class="nav-btn active" id="footer-nav-vocab" href="../user-flashcard/user-flashcard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>語彙</span>
    </a>
    <a class="nav-btn" id="footer-nav-dict" href="../user-dictionary/user-dictionary.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span>検索</span>
    </a>
    <button class="nav-btn" id="footer-search-btn" type="button" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span>検索</span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="user-flashcard.js"></script>
</body>
</html>
